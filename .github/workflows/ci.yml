name: CI

on:
  push:
    branches: [main]
  pull_request:

# The lab package runs from the repo root; each project runs from its own folder with its own
# pinned requirements, which install it from the root.
jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: lab
            dir: .
            paths: lab tests tools
            python: "3.13"
          - name: en_cy_translation
            dir: projects/en_cy_translation
            paths: .
            python: "3.13"
          - name: python_reasoning
            dir: projects/python_reasoning
            paths: .
            python: "3.13"
    name: lint (${{ matrix.name }})
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install "$(grep '^ruff==' requirements.txt)"
      - run: ruff check ${{ matrix.paths }}
      - run: ruff format --check ${{ matrix.paths }}

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: lab
            dir: .
            python: "3.13"
          - name: en_cy_translation
            dir: projects/en_cy_translation
            python: "3.13"
          - name: python_reasoning
            dir: projects/python_reasoning
            python: "3.13"
    name: test (${{ matrix.name }})
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: ${{ matrix.dir }}/requirements.txt
      # CPU build first: the default Linux wheel pulls in several GB of CUDA libraries.
      # GPU tests skip themselves without CUDA.
      - run: pip install "$(grep '^torch==' requirements.txt)" --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements.txt
      - run: pytest -q -rs
