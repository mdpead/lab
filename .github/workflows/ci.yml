name: CI

on:
  push:
    branches: [main]
  pull_request:

# Each project runs from its own folder with its own Python and pinned requirements,
# until they share mlcore and one set of versions.
jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: en_cy_translation
            python: "3.10"
          - project: python_reasoning
            python: "3.13"
    defaults:
      run:
        working-directory: projects/${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install "$(grep '^ruff==' requirements.txt)"
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: en_cy_translation
            python: "3.10"
          - project: python_reasoning
            python: "3.13"
    defaults:
      run:
        working-directory: projects/${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: projects/${{ matrix.project }}/requirements.txt
      # CPU build first: the default Linux wheel pulls in several GB of CUDA libraries.
      # GPU tests skip themselves without CUDA.
      - run: pip install "$(grep '^torch==' requirements.txt)" --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements.txt
      - run: pytest -q -rs
