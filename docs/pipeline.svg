<polyline class="line s1" points="394.2,147.7 398.4,166.2 402.6,179.0 406.8,188.7 411.0,193.4 415.2,201.4 419.4,208.3 423.6,210.3 427.8,213.8 432.0,217.2 436.2,221.6 440.4,224.0 444.6,224.3 448.8,228.3 453.0,223.8 457.2,228.7 461.4,233.4 465.6,234.3 469.8,231.8 474.0,234.2 478.2,234.7 482.4,245.8 486.6,244.8 490.8,246.4 495.0,249.4 499.2,244.9 503.4,245.9 507.6,248.0 511.8,244.8 516.0,248.4 520.2,250.7 524.4,254.2 528.6,258.9 532.8,261.8 537.0,257.1 541.2,264.8 545.4,261.3 549.6,264.0 553.8,260.1 558.0,269.5 562.2,270.4 566.4,262.0 570.6,261.4 574.8,262.7 579.0,265.8 583.2,265.2 587.4,271.9 591.6,275.8 595.8,269.2 600.0,278.9"/>
