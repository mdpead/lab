<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" role="img" aria-labelledby="title desc">
<title id="title">The full pipeline, stage by stage</title>
<desc id="desc">Three panels. Pretraining validation loss falls from 3.92 at step 500 to 1.465 at step 10,000. SFT validation loss, on a log scale, falls from 0.104 to 0.0068 over 10,000 steps. RL greedy pass@1 stays between 88.5% and 90.9% over 100 steps, starting at 90.1% and ending at 90.9%.</desc>
<style>
  .surface { fill: #fcfcfb; }
  .title { fill: #0b0b0b; font: 600 16px system-ui, -apple-system, "Segoe UI", sans-serif; }
  .panel-title { fill: #0b0b0b; font: 600 14px system-ui, -apple-system, "Segoe UI", sans-serif; }
  .subtitle, .label { fill: #52514e; font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; }
  .value { fill: #0b0b0b; font: 600 13px system-ui, -apple-system, "Segoe UI", sans-serif; }
  .tick { fill: #898781; font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; font-variant-numeric: tabular-nums; }
  .grid { stroke: #e1e0d9; stroke-width: 1; }
  .axis { stroke: #c3c2b7; stroke-width: 1; }
  .line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  circle.ring { stroke: #fcfcfb; stroke-width: 2; }
  .s1 { stroke: #2a78d6; } .s1.dot { fill: #2a78d6; }
  .s2 { stroke: #eb6834; } .s2.dot { fill: #eb6834; }
  .s3 { stroke: #1baf7a; } .s3.dot { fill: #1baf7a; }
  @media (prefers-color-scheme: dark) {
    .surface { fill: #1a1a19; }
    .title, .panel-title, .value { fill: #ffffff; }
    .subtitle, .label { fill: #c3c2b7; }
    .grid { stroke: #2c2c2a; }
    .axis { stroke: #383835; }
    circle.ring { stroke: #1a1a19; }
    .s1 { stroke: #3987e5; } .s1.dot { fill: #3987e5; }
    .s2 { stroke: #d95926; } .s2.dot { fill: #d95926; }
    .s3 { stroke: #199e70; } .s3.dot { fill: #199e70; }
  }
</style>
<rect class="surface" width="960" height="360" rx="8"/>
<text class="title" x="20" y="30">The full pipeline, stage by stage</text>
<text class="subtitle" x="20" y="50">Pretraining from base; SFT and RL from base_lr3, which fine-tunes the same pretrained weights at 3e-4.</text>
<text class="panel-title" x="20" y="80">1. Pretrain</text>
<text class="label" x="20" y="96">Validation loss, held-out Python</text>
<text class="panel-title" x="340" y="80">2. SFT</text>
<text class="label" x="340" y="96">Validation loss, held-out traces</text>
<text class="panel-title" x="650" y="80">3. RL</text>
<text class="label" x="650" y="96">Greedy pass@1, 375 held-out prompts</text>
