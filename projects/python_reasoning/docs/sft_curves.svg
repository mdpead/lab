<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc">
<title id="title">SFT validation loss for three runs</title>
<desc id="desc">Validation loss over 10,000 SFT steps on a log scale. The pretrained run at 3e-4 is lowest throughout and ends at 0.0068, the from-scratch run at 3e-4 ends at 0.0101, and the pretrained run at 1e-4 levels off and ends at 0.0138.</desc>
<style>
  .surface { fill: #fcfcfb; }
  .title { fill: #0b0b0b; font: 600 16px system-ui, -apple-system, "Segoe UI", sans-serif; }
  .panel-title { fill: #0b0b0b; font: 600 14px system-ui, -apple-system, "Segoe UI", sans-serif; }
  .subtitle, .label { fill: #52514e; font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; }
  .value { fill: #0b0b0b; font: 600 13px system-ui, -apple-system, "Segoe UI", sans-serif; }
  .tick { fill: #898781; font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; font-variant-numeric: tabular-nums; }
  .grid { stroke: #e1e0d9; stroke-width: 1; }
  .axis { stroke: #c3c2b7; stroke-width: 1; }
  .line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  circle.ring { stroke: #fcfcfb; stroke-width: 2; }
  .s1 { stroke: #2a78d6; } .s1.dot { fill: #2a78d6; }
  .s2 { stroke: #eb6834; } .s2.dot { fill: #eb6834; }
  .s3 { stroke: #1baf7a; } .s3.dot { fill: #1baf7a; }
  @media (prefers-color-scheme: dark) {
    .surface { fill: #1a1a19; }
    .title, .panel-title, .value { fill: #ffffff; }
    .subtitle, .label { fill: #c3c2b7; }
    .grid { stroke: #2c2c2a; }
    .axis { stroke: #383835; }
    circle.ring { stroke: #1a1a19; }
    .s1 { stroke: #3987e5; } .s1.dot { fill: #3987e5; }
    .s2 { stroke: #d95926; } .s2.dot { fill: #d95926; }
    .s3 { stroke: #199e70; } .s3.dot { fill: #199e70; }
  }
</style>
<rect class="surface" width="720" height="420" rx="8"/>
<text class="title" x="20" y="30">SFT validation loss</text>
<text class="subtitle" x="20" y="50">Lower is better. Same data and schedule; the runs differ in starting weights and learning rate.</text>
<line class="line s1" x1="64" y1="72" x2="82" y2="72"/>
<text class="label" x="88" y="76">Pretrained, 3e-4</text>
<line class="line s2" x1="224" y1="72" x2="242" y2="72"/>
<text class="label" x="248" y="76">From scratch, 3e-4</text>
<line class="line s3" x1="398" y1="72" x2="416" y2="72"/>
<text class="label" x="422" y="76">Pretrained, 1e-4</text>
<line class="grid" x1="64" y1="368.0" x2="520" y2="368.0"/>
<text class="tick" x="56" y="372.0" text-anchor="end">0.005</text>
<line class="grid" x1="64" y1="324.3" x2="520" y2="324.3"/>
<text class="tick" x="56" y="328.3" text-anchor="end">0.01</text>
