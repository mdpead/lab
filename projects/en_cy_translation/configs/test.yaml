name: test
seed: 0

model:
  type: encoder_decoder
  d_model: 1024
  num_enc_layers: 2
  num_dec_layers: 2
  max_length: 64
  dropout: 0.1
  norm: {type: layer}
  position: {type: sinusoidal}
  attention:
    type: mha
    num_heads: 4
  feedforward:
    type: relu
    d_ff: 1024
    bias: true

stages:
  translation:
    train:
      effective_batch_token_size: 20000
      minibatch_token_size: 8192
      learning_rate: 1.0e-4  # 1 / (D_MODEL * WARM_UP_STEPS) ** 0.5
      adam_betas: [0.9, 0.98]
      adam_eps: 1.0e-9
      num_steps: 200
      label_smoothing: 0.1
      device: cuda
      checkpoint_steps: 5
      keep_checkpoints: 2
      warm_up_steps: 5
      validation_steps: 5
      validation_batches: 1
      compile_model: true
    data:
      ds: techiaith/cardiff-university-tm-en-cy
      sample_size: 1000
      test_split_ratio: 0.1

tokenizer:
  type: wordpiece
  vocab_size: 16000
  # Sentences to train on; null uses the whole train split
  training_size: 1000
  # Welsh accents are dropped, so "tân" and "tan" share tokens
  strip_accents: true

locations:
  data_dir: ./data
  models_dir: ./models
