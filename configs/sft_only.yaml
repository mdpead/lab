name: sft_only
seed: 0

# Full-size model and StarCoder tokenizer, but no pretraining: there is no pretrain stage,
# and sft has no init_from_step, so it trains from random init. Run scripts.tokenizer, then
# scripts.sft. Only the pretraining differs from a base run, which isolates what it
# contributes.
model:
  d_model: 1024
  num_heads: 16
  num_kv_heads: 4
  d_h: 64
  max_length: 1024
  d_ff: 1408
  num_experts: 4
  top_k: 2
  capacity_factor: 1.25
  num_layers: 16
  dropout: 0.0

train:
  sft:
    effective_batch_token_size: 32768
    # 2048 rather than base's 4096: ragged batches fragmented the allocator at 4096 and
    # throughput collapsed from 17k to 1.3k tokens/sec.
    minibatch_token_size: 2048
    learning_rate: 3.0e-4      # from scratch, not a fine-tune
    adam_betas: [0.9, 0.95]
    adam_eps: 1.0e-8
    num_steps: 10000           # ~328M tokens; ~5h at 17.9k tok/s
    label_smoothing: 0.0
    router_aux_loss_coef: 0.01
    device: cuda
    checkpoint_steps: 2000
    keep_checkpoints: 2        # 4.2GB each
    warm_up_steps: 200
    validation_steps: 200
    validation_batches: 1
    compile_model: false       # ragged batch widths; see base
    num_workers: 8
    prefetch_factor: 4

  rl:
    # Untuned, as in base
    generation_prompts_size: 64    # x completions_per_prompt = 512 rows, the whole step in
                                   # one batch (untested here; measured on `search`)
    effective_prompts_size: 64     # prompts per update: 512 rollouts, of which only groups
                                   # whose rollouts disagree are trained on (about a fifth)
    completions_per_prompt: 8
    minibatch_token_size: 2048     # padded tokens per backward pass; half of base's, as
                                   # for sft above
    learning_rate: 1.0e-5
    lr_schedule: constant
    adam_betas: [0.9, 0.95]
    adam_eps: 1.0e-8
    num_steps: 100
    max_new_tokens: 256
    temperature: 1.0
    router_aux_loss_coef: 0.01
    device: cuda
    checkpoint_steps: 20           # 4.2GB each
    keep_checkpoints: 1
    warm_up_steps: 5
    validation_steps: 25
    validation_prompts_size: 32    # prompts per validation batch
    validation_batches: 13         # the whole ~400-prompt test split
    validation_samples: 2          # sampled rollouts per test prompt
    compile_model: false
    cache_clear_steps: 1
    init_from_step: 10000          # sft's final step

data:
  pretrain:
    test_split_ratio: 0.001
    # The corpus the tokenizer is trained on. sample_size caps the files loaded.
    num_shards: 1
    sample_size: 60000

  sft:
    num_records: 2500000    # ~2.25M train rows at ~129 tokens: ~3 epochs over 10k steps
    tier: easy
    tasks: [output]
    inputs_per_fn: 4
    with_trace: true
    test_split_ratio: 0.02

  rl:
    num_records: 8000       # ~7,600 train / ~400 test prompts, from their own seed
    tier: easy
    tasks: [output]
    inputs_per_fn: 4
    test_split_ratio: 0.05

tokenizer:
  vocab_size: 32000
  training_size: 50000
  digit_split: true

locations:
  data_dir: ./data
  models_dir: ./models
